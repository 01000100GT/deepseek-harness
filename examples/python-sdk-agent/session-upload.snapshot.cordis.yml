# Keyless counterpart of session-upload.cordis.yml: retain the opt-in while
# replacing only the live adapter with fixture-backed replay.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: session-log-deepseek
        name: '@deepseek-ai/dsh-session-log-deepseek'
        config:
          enabled: true
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
