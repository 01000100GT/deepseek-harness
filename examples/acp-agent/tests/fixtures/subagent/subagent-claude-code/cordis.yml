# Test-only composition of the Claude Code foreground tool around its Bundle-supplied provider.
# The owning e2e applies the package's real patch and never invokes a model or product process.
- id: fixture
  name: './fixture.ts'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: tool-subagent-claude-code
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: claude-code
    toolName: subagent_claude_code
    enableRunInBackground: false
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'This composition test must not start a model turn.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
